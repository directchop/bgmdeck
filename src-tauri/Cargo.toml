[package]
name = "bgmdeck"
version = "0.9.0"
description = "BGM Deck — pad-style background music player for live events"
authors = ["directchop"]
license = ""
repository = "https://github.com/directchop/bgmdeck"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bgmdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
cpal = "0.15"
symphonia = { version = "0.5", features = ["aiff", "mp3", "wav", "flac", "isomp4", "aac", "ogg", "vorbis"] }
rtrb = "0.3"
rosc = "0.11"
if-addrs = "0.13"
socket2 = { version = "0.6", features = ["all"] }
midir = "0.10"

# The audio callback must stay fast in `tauri dev` too: bump optimisation for
# the audio stack so dev builds don't underrun.
[profile.dev.package.bgmdeck]
opt-level = 2
[profile.dev.package.cpal]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package."*"]
opt-level = 1
